[project]
name = "latent-space-jam"
version = "0.1.0"
description = "Latent Space Jamming: Layout-Guided Video Generation via Attention Optimization"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.12.0",
    "av>=16.1.0",
    "bitsandbytes>=0.49.1",
    "diffusers>=0.36.0",
    "ftfy>=6.3.1",
    "hydra-core>=1.3.2",
    "imageio>=2.37.2",
    "imageio-ffmpeg>=0.6.0",
    "ltx-core",
    "ltx-pipelines",
    "protobuf>=6.33.5",
    "sdnq>=0.1.3",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "transformers>=4.57.3",
]

[dependency-groups]
dev = [
    "gpustat>=1.1.1",
    "hydra-core>=1.3.2",
    "ipykernel>=7.1.0",
    "loguru>=0.7.3",
    "opencv-python>=4.13.0.92",
    "ruff>=0.14.10",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
diffusers = { git = "https://github.com/huggingface/diffusers.git", branch = "main" }
sdnq = { git = "https://github.com/Disty0/sdnq", branch = "main" }
ltx-core = { git = "https://github.com/Lightricks/LTX-2.git", subdirectory = "packages/ltx-core", branch = "main" }
ltx-pipelines = { git = "https://github.com/Lightricks/LTX-2.git", subdirectory = "packages/ltx-pipelines", branch = "main" }

[tool.ruff]
line-length = 150

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="lightBlur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5a7ea6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#5a7ea6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c07a6b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c07a6b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Clean background -->
  <rect width="200" height="200" rx="14" ry="14" fill="#f7f8fa"/>

  <!-- Bbox 1: muted blue -->
  <rect x="20" y="20" width="90" height="85" rx="4" ry="4" fill="#5a7ea6" opacity="0.07"/>
  <rect x="20" y="20" width="90" height="85" rx="4" ry="4" fill="none" stroke="#5a7ea6" stroke-width="2.5"/>

  <!-- Bbox 1 attention glow -->
  <circle cx="65" cy="62" r="28" fill="url(#glow1)" filter="url(#lightBlur)"/>

  <!-- Bbox 1 subject dot -->
  <circle cx="65" cy="62" r="5.5" fill="#5a7ea6"/>
  <circle cx="65" cy="62" r="8.5" fill="#5a7ea6" opacity="0.08"/>

  <!-- Bbox 1 dashed curve: up-right -->
  <path d="M 65 62 C 90 25, 108 12, 128 7"
        fill="none" stroke="#5a7ea6" stroke-width="2.5" stroke-dasharray="5,4" opacity="0.7"/>
  <!-- Arrow 1 -->
  <g transform="translate(128, 7) rotate(-14)">
    <path d="M -5 -3.5 L 3 0 L -5 3.5 Z" fill="#5a7ea6"/>
  </g>

  <!-- Bbox 2: warm terracotta -->
  <rect x="90" y="95" width="90" height="85" rx="4" ry="4" fill="#c07a6b" opacity="0.07"/>
  <rect x="90" y="95" width="90" height="85" rx="4" ry="4" fill="none" stroke="#c07a6b" stroke-width="2.5"/>

  <!-- Bbox 2 attention glow -->
  <circle cx="135" cy="137" r="28" fill="url(#glow2)" filter="url(#lightBlur)"/>

  <!-- Bbox 2 subject dot -->
  <circle cx="135" cy="137" r="5.5" fill="#c07a6b"/>
  <circle cx="135" cy="137" r="8.5" fill="#c07a6b" opacity="0.08"/>

  <!-- Bbox 2 dashed curve: down-left -->
  <path d="M 135 137 C 110 175, 92 188, 72 193"
        fill="none" stroke="#c07a6b" stroke-width="2.5" stroke-dasharray="5,4" opacity="0.7"/>
  <!-- Arrow 2 -->
  <g transform="translate(72, 193) rotate(166)">
    <path d="M -5 -3.5 L 3 0 L -5 3.5 Z" fill="#c07a6b"/>
  </g>
</svg>
